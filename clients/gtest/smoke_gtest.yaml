---
include: hipblaslt_common.yaml
include: known_bugs.yaml
include: matmul_common.yaml

Definitions:
  - &alpha_beta_range
    - { alpha:  5, beta:  0 }
    - { alpha:  0, beta:  3 }
    - { alpha:  1, beta:  3 }
    - { alpha:  1, beta:  1 }

  - &alpha_beta_range_small
    - { alpha: 2, alphai: 2, beta: -1.0, betai: 2.0 }

  - &transA_transB_range
    - { transA: N, transB: N }
    - { transA: N, transB: T }
    - { transA: T, transB: N }
    - { transA: T, transB: T }

  - &deepbench_alpha_beta_range
    - { alpha: 1, beta: 0 }
    - { alpha: 1, beta: 1 }

  - &deepbench_transA_transB_range
    - { transA: N, transB: N }
    - { transA: N, transB: T }
    - { transA: T, transB: N }

  - &ldd_transA_transB_range
    - { transA: N, transB: N }
    - { transA: N, transB: T }
    - { transA: T, transB: N }
    - { transA: T, transB: T }

  - &conjugate_transA_transB_range
    - { transA: T, transB: C }
    - { transA: C, transB: T }
    - { transA: N, transB: C }
    - { transA: C, transB: N }
    - { transA: C, transB: C }


Tests:
- name: matmul_small_smoke
  category: smoke
  function:
    matmul: *real_precisions
  matrix_size: *smoke_matrix_size_range
  transA_transB: *transA_transB_range
  alpha_beta: *alpha_beta_range
  c_equal_d: [false, true]

- name: matmul_conj_small_smoke
  category: smoke
  function:
    matmul: *real_precisions
  matrix_size: *smoke_matrix_size_range
  transA_transB: *conjugate_transA_transB_range
  alpha_beta: *alpha_beta_range_small
  c_equal_d: [false, true]

