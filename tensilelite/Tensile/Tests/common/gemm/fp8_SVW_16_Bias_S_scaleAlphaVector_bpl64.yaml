TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201] # not supported by arch

GlobalParameters:

  NumElementsToValidate: -1
  MinimumRequiredVersion: 4.14.0
  PrintLevel: 1
  PrintSolutionRejectionReason: True
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeBeta: 1
  DataInitTypeAlpha: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeBias: 21
  DataInitTypeScaleAlphaVec: 21
  NumElementsToValidate: -1
  BoundsCheck: 2

BenchmarkProblems:
- - OperationType: GEMM
    DataType: F8
    DataTypeA: F8
    DataTypeB: F8
    DestDataType: H
    ComputeDataType: S
    HighPrecisionAccumulate: true
    TransposeA: True
    TransposeB: False
    #ComplexConjugateA: True
    #ComplexConjugateB: False
    UseBeta: True
    BiasDataTypeList: [s]
    UseBias: 1
    UseScaleAlphaVec: 1
    Batched: True
    #Activation: True
    #ActivationHPA: True
  - InitialSolutionParameters: 
    BenchmarkCommonParameters:
    - KernelLanguage: [Assembly]
    ForkParameters:
    - 1LDSBuffer: [1]
    - DepthU: [64, 128]
    - GlobalReadVectorWidthA: [4, 16]
    - GlobalReadVectorWidthB: [4, 16]
    - WaveSeparateGlobalReadA: [0]
    - WaveSeparateGlobalReadB: [0]
    - NumElementsPerBatchStore: [16]
    - NonTemporalA: [0]
    - PrefetchGlobalRead: [2]
    - PrefetchLocalRead: [1]
    - SourceSwap: [1]
    - StaggerU: [8]
    - StorePriorityOpt: [1]
    - StoreSyncOpt: [4]
    - WorkGroupMapping: [-48]
    - WorkGroupMappingXCC: [1]
    - MIArchVgpr: [1] #[0,1]
    - GlobalSplitUAlgorithm: ["MultipleBuffer"]
    - Groups:
      - - NonTemporalC: 4
          NonTemporalD: 4
      - 
        
        - MatrixInstruction: [16, 16, 32,  1,  1, 16,  3,  1,  4] # MT 256x192 - TT 16x48  - WG 16x16  - MIBlockM:  1 -- sizes [[(57344, 8192, 1, 8192)]]
          MIArchVgpr: 0
       
    BenchmarkJoinParameters: 
    BenchmarkFinalParameters:
    - ProblemSizes:
      - Exact: [ 1024, 1024, 1, 1024 ]
    - BiasTypeArgs: ['s']

